name: Build V2Board Docker and Release
on:
  push:
    branches: [master]
    tags: ['v*', '[0-9]*']
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: v2board-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally for verification and packaging
        run: docker build --pull -t v2board-release:${GITHUB_SHA} .
      - name: Prepare vendor-inclusive deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/app
          cid="$(docker create v2board-release:${GITHUB_SHA})"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/var/www/html/." dist/app/
          rm -f dist/app/.env
          rm -rf dist/app/.git dist/app/node_modules
          test -f dist/app/vendor/autoload.php
          test -f dist/app/public/index.php
          (cd dist/app && zip -q -r ../v2board-deploy.zip .)
          sha256sum dist/v2board-deploy.zip > dist/SHA256SUMS
      - name: Upload deployable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2board-deploy-${{ github.sha }}
          path: |
            dist/v2board-deploy.zip
            dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
      - name: Build and publish GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/v2board-deploy.zip dist/SHA256SUMS --target "${GITHUB_SHA}" --title "V2Board ${GITHUB_REF_NAME}" --generate-notes --verify-tag
